spring.application.name=email-automation
spring.devtools.add-properties=false
spring.devtools.restart.enabled=false

# Ocean.io
ocean.api.key=${OCEAN_API_KEY:test}

# Prospeo
prospeo.api.key=${PROSPEO_API_KEY:test}

# Eazyreach
eazyreach.client.id=${EAZYREACH_CLIENT_ID:test}
eazyreach.client.secret=${EAZYREACH_CLIENT_SECRET:test}

# Brevo
brevo.api.key=${BREVO_API_KEY:test}
brevo.sender.name=${BREVO_SENDER_NAME:test}
brevo.sender.email=${BREVO_SENDER_EMAIL:test}

# Pipeline Config
pipeline.lookalike.limit=${PIPELINE_LOOKALIKE_LIMIT:10}
pipeline.email.subject=${PIPELINE_EMAIL_SUBJECT:test}

# Disable web server
spring.main.web-application-type=none
spring.devtools.restart.enabled=false
spring.devtools.add-properties=false

# Pipeline Config
pipeline.lookalike.limit=10
pipeline.email.subject=Quick Introduction - Exploring Potential Synergies