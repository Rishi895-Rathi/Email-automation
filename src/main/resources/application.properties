spring.application.name=email-automation
spring.devtools.add-properties=false
spring.devtools.restart.enabled=false

# Hunter.io
hunter.api.key=${HUNTER_API_KEY}
hunter.domain.search.limit=${HUNTER_DOMAIN_SEARCH_LIMIT:10}
hunter.confidence.threshold=${HUNTER_CONFIDENCE_THRESHOLD:50}

# ZeroBounce
zerobounce.api.key=${ZEROBOUNCE_API_KEY}

# Gmail API
gmail.client.id=${GMAIL_CLIENT_ID}
gmail.client.secret=${GMAIL_CLIENT_SECRET}
gmail.refresh.token=${GMAIL_REFRESH_TOKEN}
gmail.sender.email=${GMAIL_SENDER_EMAIL}

# Pipeline Config
pipeline.email.subject=${PIPELINE_EMAIL_SUBJECT:Quick Introduction - Exploring Potential Synergies}

# Disable web server
spring.main.web-application-type=none