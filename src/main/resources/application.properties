spring.application.name=sales-pipeline
spring.devtools.add-properties=false
spring.devtools.restart.enabled=false

# Ocean.io
ocean.api.key=${OCEAN_API_KEY}

# Prospeo
prospeo.api.key=${PROSPEO_API_KEY}

# Eazyreach
eazyreach.client.id=${EAZYREACH_CLIENT_ID}
eazyreach.client.secret=${EAZYREACH_CLIENT_SECRET}

# Brevo
brevo.api.key=${BREVO_API_KEY}
brevo.sender.name=${BREVO_SENDER_NAME}
brevo.sender.email=${BREVO_SENDER_EMAIL}

# Pipeline Config
pipeline.lookalike.limit=${PIPELINE_LOOKALIKE_LIMIT}
pipeline.email.subject=${PIPELINE_EMAIL_SUBJECT}

# Disable web server
spring.main.web-application-type=none
spring.devtools.restart.enabled=false
spring.devtools.add-properties=false

# Pipeline Config
pipeline.lookalike.limit=10
pipeline.email.subject=Quick Introduction - Exploring Potential Synergies